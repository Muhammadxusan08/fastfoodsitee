<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 FastBite — Tez Taomlar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ec0331;
    --red-dark: #B5001F;
    --orange: #FF6B00;
    --yellow: #FFD000;
    --dark: #0F0F0F;
    --dark2: #1A1A1A;
    --dark3: #252525;
    --card: #1E1E1E;
    --text: #F5F5F5;
    --muted: #888;
    --border: #2E2E2E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,15,15,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--red);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--yellow);
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(255,208,0,0.3);
  }
  .logo span { color: var(--red); }
  .cart-btn {
    background: var(--red);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: all 0.2s;
    position: relative;
  }
  .cart-btn:hover { background: var(--red-dark); transform: scale(1.05); }
  .cart-count {
    background: var(--yellow);
    color: var(--dark);
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #0F0F0F 0%, #1a0a00 50%, #0F0F0F 100%);
    padding: 60px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(232,0,45,0.15) 0%, transparent 70%);
  }
  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 10vw, 100px);
    line-height: 0.9;
    color: var(--text);
    position: relative;
  }
  .hero h1 span { color: var(--red); }
  .hero p {
    margin-top: 16px;
    font-size: 18px;
    color: var(--muted);
    position: relative;
  }
  .fire-row {
    font-size: 40px;
    margin-bottom: 12px;
    animation: float 2s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* CATEGORIES */
  .categories {
    display: flex; gap: 10px;
    overflow-x: auto;
    padding: 24px;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    background: var(--card);
    border: 2px solid var(--border);
    color: var(--muted);
    padding: 10px 20px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .cat-btn:hover, .cat-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  /* MENU GRID */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    padding: 8px 24px 16px;
    color: var(--yellow);
    letter-spacing: 1px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 0 24px 40px;
  }
  .food-card {
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: all 0.3s;
    position: relative;
  }
  .food-card:hover {
    transform: translateY(-6px);
    border-color: var(--red);
    box-shadow: 0 16px 40px rgba(232,0,45,0.2);
  }
  .food-img {
    width: 100%; height: 180px;
    object-fit: cover;
    background: var(--dark3);
    display: flex; align-items: center; justify-content: center;
    font-size: 80px;
  }
  .food-info { padding: 16px; }
  .food-name {
    font-weight: 800; font-size: 17px;
    margin-bottom: 6px;
  }
  .food-desc {
    font-size: 13px; color: var(--muted);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .food-bottom {
    display: flex; align-items: center; justify-content: space-between;
  }
  .food-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--yellow);
  }
  .food-price span { font-family: 'Nunito'; font-size: 13px; color: var(--muted); }
  .add-btn {
    background: var(--red);
    color: white;
    border: none;
    width: 42px; height: 42px;
    border-radius: 12px;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:hover { background: var(--orange); transform: scale(1.1); }
  .add-btn.added { background: #22c55e; }
  .badge {
    position: absolute; top: 12px; left: 12px;
    background: var(--red);
    color: white;
    font-size: 11px; font-weight: 800;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* CART SIDEBAR */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .cart-sidebar {
    position: fixed; right: -440px; top: 0; bottom: 0;
    width: 440px; max-width: 100vw;
    background: var(--dark2);
    z-index: 300;
    transition: right 0.35s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
    border-left: 2px solid var(--red);
  }
  .cart-sidebar.open { right: 0; }
  .cart-header {
    padding: 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .cart-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; color: var(--yellow);
  }
  .close-btn {
    background: var(--dark3); border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 10px;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
  .cart-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--dark3);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .ci-emoji { font-size: 36px; }
  .ci-info { flex: 1; }
  .ci-name { font-weight: 800; font-size: 15px; }
  .ci-price { color: var(--yellow); font-weight: 700; font-size: 14px; }
  .ci-qty {
    display: flex; align-items: center; gap: 8px;
  }
  .qty-btn {
    background: var(--dark); border: 1px solid var(--border);
    color: var(--text); width: 30px; height: 30px;
    border-radius: 8px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .qty-btn:hover { background: var(--red); border-color: var(--red); }
  .qty-num { font-weight: 800; min-width: 20px; text-align: center; }
  .cart-empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 16px;
  }
  .cart-empty div { font-size: 64px; margin-bottom: 16px; }

  /* ORDER FORM */
  .order-section {
    padding: 20px;
    border-top: 1px solid var(--border);
    background: var(--dark2);
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .total-label { font-weight: 700; color: var(--muted); font-size: 14px; }
  .total-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px; color: var(--yellow);
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .form-group input, .form-group textarea {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--red);
  }
  .form-group textarea { resize: none; height: 80px; }
  .location-row {
    display: flex; gap: 8px;
  }
  .location-row input { flex: 1; }
  .loc-btn {
    background: var(--dark3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 0 14px;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .loc-btn:hover { border-color: var(--red); }
  .order-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .order-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .order-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* SUCCESS */
  .success-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .success-modal.open { opacity: 1; pointer-events: all; }
  .success-box {
    background: var(--card);
    border-radius: 24px;
    padding: 48px 36px;
    text-align: center;
    max-width: 360px; width: 90%;
    border: 2px solid #22c55e;
    animation: popIn 0.4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes popIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
  .success-box .icon { font-size: 72px; margin-bottom: 16px; }
  .success-box h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; color: #22c55e;
    margin-bottom: 10px;
  }
  .success-box p { color: var(--muted); font-size: 15px; line-height: 1.6; }
  .success-box button {
    margin-top: 24px;
    background: #22c55e; color: white; border: none;
    padding: 14px 32px; border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Fast<span>Bite</span> 🔥</div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Savat <div class="cart-count" id="cartCount">0</div>
  </button>
</header>

<!-- HERO -->
<div class="hero">
  <div class="fire-row">🍔 🍕 🌮 🍟</div>
  <h1>MAZALI<br><span>TEZKOR</span><br>TAOMLAR</h1>
  <p>Buyurtma bering — yetkazib boramiz! 🚀</p>
</div>

<!-- CATEGORIES -->
<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">🍽️ Barchasi</button>
  <button class="cat-btn" onclick="filterCat('burger', this)">🍔 Burgerlar</button>
  <button class="cat-btn" onclick="filterCat('pizza', this)">🍕 Pizzalar</button>
  <button class="cat-btn" onclick="filterCat('donar', this)">🌮 Do'narlar</button>
  <button class="cat-btn" onclick="filterCat('sides', this)">🍟 Qo'shimchalar</button>
  <button class="cat-btn" onclick="filterCat('drinks', this)">🥤 Ichimliklar</button>
</div>

<div class="section-title">MENYU</div>

<!-- MENU GRID -->
<div class="menu-grid" id="menuGrid"></div>

<!-- OVERLAY -->

<!-- CART SIDEBAR -->
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h2>🛒 Savatingiz</h2>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="order-section">

        <input type="text" id="clientAddress" placeholder="Ko'cha, uy raqami...">
        <button class="loc-btn" onclick="getLocation()" title="GPS joylashuv">📍 GPS</button>
      </div>
      <input type="hidden" id="clientLat">
      <input type="hidden" id="clientLon">
    </div>
    <div class="form-group">
      <label>💬 Qo'shimcha izoh</label>
      <textarea id="clientNote" placeholder="Xohlagan izohlarsiz qoldiring..."></textarea>
    </div>
    <button class="order-btn" id="orderBtn" onclick="sendOrder()">
      📲 BUYURTMA BERISH
    </button>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="success-modal" id="successModal">
  <div class="success-box">
    <div class="icon">🎉</div>
    <h3>Buyurtma Qabul!</h3>
    <p>Sizning buyurtmangiz qabul qilindi. Tez orada siz bilan bog'lanamiz!</p>
    <button onclick="closeSuccess()">Rahmat! 👍</button>
  </div>
</div>

<script>
const TELEGRAM_BOT_TOKEN = '8968813432:AAFTkaNFIxCJ_lJOfazgOxSP072CwFwBuJw';
const TELEGRAM_CHAT_ID = '7537936930';

const menu = [
  { id:1, name:'Classic Burger', emoji:'🍔', price:35000, desc:"Mol go'shti, salat, pomidor, pishloq va maxsus sous bilan", cat:'burger', badge:'🔥 Ommabop' },
  { id:2, name:'Double Smash Burger', emoji:'🍔', price:52000, desc:'Ikki qatlam go\'sht, karamelized piyoz, cheddar pishloq', cat:'burger', badge:'⭐ Yangi' },
  { id:3, name:'Crispy Chicken Burger', emoji:'🍗', price:42000, desc:'Qovurilgan tovuq, coleslaw salat, mayonez sous', cat:'burger' },
  { id:4, name:'BBQ Bacon Burger', emoji:'🥓', price:58000, desc:'BBQ sous, bacon, cheddar, jalapeno', cat:'burger' },
  { id:5, name:'Margarita Pizza', emoji:'🍕', price:68000, desc:'Mozzarella pishloq, pomidor sous, yangi rayhon', cat:'pizza' },
  { id:6, name:'Pepperoni Pizza', emoji:'🍕', price:79000, desc:'Pepperoni, mozzarella, italyan sous', cat:'pizza', badge:'🔥 Ommabop' },
  { id:7, name:'BBQ Chicken Pizza', emoji:'🍕', price:85000, desc:'Tovuq, BBQ sous, qizil piyoz, mozzarella', cat:'pizza' },
  { id:8, name:'4 Cheese Pizza', emoji:'🍕', price:92000, desc:'Mozzarella, cheddar, parmezan, gorgonzola', cat:'pizza' },
  { id:9, name:'Klassik Do\'nar', emoji:'🌮', price:32000, desc:'Tovuq, salat, pomidor, garmdori souslari bilan lavash', cat:'donar', badge:'🔥 Ommabop' },
  { id:10, name:'Beef Do\'nar', emoji:'🥙', price:38000, desc:"Mol go'shti, lavash, sabzavotlar, tahini sous", cat:'donar' },
  { id:11, name:'Durum Do\'nar', emoji:'🌯', price:40000, desc:'Aloqa tarzidagi do\'nar, to\'la to\'ldirish', cat:'donar' },
  { id:12, name:'Kartoshka Fri', emoji:'🍟', price:18000, desc:'Tuzlangan kartoshka fri, ketchup bilan', cat:'sides' },
  { id:13, name:'Cheese Fries', emoji:'🧀', price:24000, desc:'Kartoshka fri, eritilgan pishloq sousi', cat:'sides' },
  { id:14, name:'Chicken Nuggets 6pc', emoji:'🍗', price:28000, desc:'6 dona mazali tovuq nuggets, sous bilan', cat:'sides' },
  { id:15, name:'Onion Rings', emoji:'🧅', price:22000, desc:'Qovurilgan piyoz halqalari, BBQ sous bilan', cat:'sides' },
  { id:16, name:'Coca-Cola 0.5L', emoji:'🥤', price:10000, desc:'Muzdek Coca-Cola', cat:'drinks' },
  { id:17, name:'Lemonade Fresh', emoji:'🍋', price:15000, desc:'Yangi limon bilan tayyorlangan limonad', cat:'drinks' },
  { id:18, name:'Mango Smoothie', emoji:'🥭', price:18000, desc:'Yangi mango sharbati', cat:'drinks' },
];

let cart = [];
let currentCat = 'all';

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  const items = currentCat === 'all' ? menu : menu.filter(i => i.cat === currentCat);
  grid.innerHTML = items.map(item => `
    <div class="food-card" id="card-${item.id}">
      ${item.badge ? `<div class="badge">${item.badge}</div>` : ''}
      <div class="food-img">${item.emoji}</div>
      <div class="food-info">
        <div class="food-name">${item.name}</div>
        <div class="food-desc">${item.desc}</div>
        <div class="food-bottom">
          <div class="food-price">${(item.price/1000).toFixed(0)}K <span>so'm</span></div>
          <button class="add-btn" id="btn-${item.id}" onclick="addToCart(${item.id})">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderMenu();
}

function addToCart(id) {
  const item = menu.find(m => m.id === id);
  const existing = cart.find(c => c.id === id);
  if (existing) existing.qty++;
  else cart.push({ ...item, qty: 1 });

  const btn = document.getElementById('btn-' + id);
  if (btn) {
    btn.textContent = '✓';
    btn.classList.add('added');
    setTimeout(() => { btn.textContent = '+'; btn.classList.remove('added'); }, 800);
  }
  updateCart();
}

function updateCart() {
  document.getElementById('cartCount').textContent = cart.reduce((s,i) => s + i.qty, 0);
  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  document.getElementById('totalAmount').textContent = total.toLocaleString('uz-UZ') + ' so\'m';
  renderCartItems();
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  if (!cart.length) {
    el.innerHTML = `<div class="cart-empty"><div>🛒</div>Savat bo'sh<br>Taom qo'shing!</div>`;
    return;
  }
  el.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="ci-emoji">${item.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${(item.price * item.qty).toLocaleString('uz-UZ')} so'm</div>
      </div>
      <div class="ci-qty">
        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta) {
  const idx = cart.findIndex(c => c.id === id);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateCart();
}

function toggleCart() {
  document.getElementById('cartSidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function getLocation() {
  const btn = document.querySelector('.loc-btn');
  btn.textContent = '⏳';
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('clientLat').value = pos.coords.latitude;
    document.getElementById('clientLon').value = pos.coords.longitude;
    document.getElementById('clientAddress').value = `📍 GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
    btn.textContent = '✅';
    setTimeout(() => btn.textContent = '📍 GPS', 2000);
  }, () => {
    btn.textContent = '❌';
    setTimeout(() => btn.textContent = '📍 GPS', 2000);
    alert('Joylashuvni aniqlab bo\'lmadi. Manzilni qo\'lda kiriting.');
  });
}

async function sendOrder() {
  const name = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const address = document.getElementById('clientAddress').value.trim();
  const note = document.getElementById('clientNote').value.trim();
  const lat = document.getElementById('clientLat').value;
  const lon = document.getElementById('clientLon').value;

  if (!cart.length) { alert('Savat bo\'sh! Avval taom qo\'shing.'); return; }
  if (!name) { alert('Ismingizni kiriting!'); return; }
  if (!phone) { alert('Telefon raqamingizni kiriting!'); return; }
  if (!address) { alert('Manzilingizni kiriting!'); return; }

  const btn = document.getElementById('orderBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Yuborilmoqda...';

  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const items = cart.map(i => `  ${i.emoji} ${i.name} × ${i.qty} = ${(i.price*i.qty).toLocaleString('uz-UZ')} so'm`).join('\n');

  const msg = `🔔 YANGI BUYURTMA!\n\n` +
    `👤 Mijoz: ${name}\n` +
    `📞 Telefon: ${phone}\n` +
    `📍 Manzil: ${address}\n` +
    (lat && lon ? `🗺 GPS: https://maps.google.com/?q=${lat},${lon}\n` : '') +
    (note ? `💬 Izoh: ${note}\n` : '') +
    `\n🛒 Buyurtma:\n${items}\n\n` +
    `💰 JAMI: ${total.toLocaleString('uz-UZ')} som\n` +
    `⏰ Vaqt: ${new Date().toLocaleString('uz-UZ')}`;

  try {
    // 1. Matnli xabar yuborish
    const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: msg
      })
    });

    // 2. Agar GPS koordinatlar bo'lsa, locatsiya yuborish
    if (lat && lon) {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendLocation`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          latitude: parseFloat(lat),
          longitude: parseFloat(lon)
        })
      });
    }

    const data = await res.json();
    if (data.ok) {
      cart = [];
      updateCart();
      toggleCart();
      document.getElementById('successModal').classList.add('open');
      document.getElementById('clientName').value = '';
      document.getElementById('clientPhone').value = '';
      document.getElementById('clientAddress').value = '';
      document.getElementById('clientNote').value = '';
      document.getElementById('clientLat').value = '';
      document.getElementById('clientLon').value = '';
    } else {
      throw new Error(data.description || 'Telegram xatosi');
    }
  } catch (e) {
    alert('Xato yuz berdi: ' + e.message + '\n\nBot token va Chat ID ni tekshiring!');
  }

  btn.disabled = false;
  btn.textContent = '📲 BUYURTMA BERISH';
}

function closeSuccess() {
  document.getElementById('successModal').classList.remove('open');
}

// INIT
renderMenu();
</script>
<div></div>
</body>
</html>
